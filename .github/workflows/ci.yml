name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Sandbox and search tools used by the tests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap ripgrep
          # Ubuntu 24.04+ restricts unprivileged user namespaces, which bubblewrap needs.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          bwrap --ro-bind / / --dev /dev --proc /proc --unshare-pid true
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then echo "gofmt needed:"; echo "$unformatted"; exit 1; fi
      - name: go vet (linux, darwin)
        run: |
          go vet ./...
          GOOS=darwin go vet ./...
      - name: go test -race
        env:
          TERNLY_REQUIRE_SANDBOX: "1" # sandbox/security tests fail instead of skipping
        run: go test -race ./...
      - name: static build
        run: |
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o ternly .
          file ternly | grep -q 'statically linked'
      - name: goreleaser check
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: check

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: go test -race (Linux-only tests are build-tagged out)
        run: go test -race ./...
