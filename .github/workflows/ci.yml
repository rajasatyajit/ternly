name: ci

on:
  push:
    branches: ["**"] # tags run it through release.yml
  pull_request:
  workflow_dispatch:
  workflow_call: # the release workflow gates on it

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Sandbox and search tools used by the tests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap ripgrep
          # Ubuntu 24.04+ restricts unprivileged user namespaces, which bubblewrap needs.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          bwrap --ro-bind / / --dev /dev --proc /proc --unshare-pid true
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then echo "gofmt needed:"; echo "$unformatted"; exit 1; fi
      - name: go vet (linux, darwin)
        run: |
          go vet ./...
          GOOS=darwin go vet ./...
          go vet -tags e2e . # the real-model suite (bench/run.sh e2e) must keep compiling
          go test -tags e2e -run '^TestManifestMatchesChecks$' . # …and its manifest must match its checks
          go vet -tags ternly_all_grammars ./internal/graph # the opt-in build keeps compiling
      - name: go test -race
        env:
          TERNLY_REQUIRE_SANDBOX: "1" # sandbox/security tests fail instead of skipping
        run: go test -race ./...
      - name: static build
        run: |
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o ternly .
          file ternly | grep -q 'statically linked'
      - name: goreleaser check
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: "~> v2"
          args: check

  perf:
    # ADR 017: interleaved A/B benchmarks (base vs this PR), compared with
    # benchstat; a significant regression beyond the budget in bench/perf.json fails.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the base branch, for the A side
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Search tool used by the grep benchmark
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep
      - name: perf gate
        env:
          BASE_REF: ${{ github.base_ref }}
          PERF_OUT: ${{ runner.temp }}/perf
        run: bench/run.sh perf "origin/$BASE_REF"
      - name: summary
        if: always()
        env:
          PERF_OUT: ${{ runner.temp }}/perf
        run: |
          cat "$PERF_OUT/summary.md" >> "$GITHUB_STEP_SUMMARY" || true
          { echo; echo '```'; cat "$PERF_OUT/benchstat.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: perf-${{ github.event.pull_request.number }}
          path: ${{ runner.temp }}/perf
          retention-days: 30

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: go test -race (Linux-only tests are build-tagged out)
        run: go test -race ./...
